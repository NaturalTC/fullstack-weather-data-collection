spring.application.name=fullstack-weather-data-collection-platform

# MySQL connection
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/weather_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update

# OpenWeatherMap API
weather.api.key=${WEATHER_API_KEY:}
weather.api.url=https://api.openweathermap.org/data/2.5/weather
weather.forecast.url=https://api.openweathermap.org/data/2.5/forecast
weather.aqi.url=https://api.openweathermap.org/data/2.5/air_pollution

# Admin credentials
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:changeme}

# Actuator
management.endpoints.web.exposure.include=health,caches,metrics
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=GET
management.endpoints.web.cors.allowed-headers=*

# Email (SMTP) — set these via environment variables, never hardcode credentials
# Works with Gmail (use an App Password, not your real password) or any SMTP provider
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Caffeine cache — keeps forecast/AQI/heatmap/summary results in memory for 10 minutes
# so we don't hammer OpenWeatherMap or the database on every request
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m,recordStats
spring.cache.cache-names=forecast,aqi,heatmap,dailySummary,latestWeather
