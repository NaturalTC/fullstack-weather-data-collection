spring.application.name=fullstack-weather-data-collection-platform

# MySQL connection
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/weather_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update

# Weather data — Open-Meteo (free, no API key required)
# https://open-meteo.com — replaces OpenWeatherMap to eliminate API costs

# Admin credentials
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:changeme}

# Actuator
management.endpoints.web.exposure.include=health,caches,metrics
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=GET
management.endpoints.web.cors.allowed-headers=*

# Email (SMTP) — set these via environment variables, never hardcode credentials
# Works with Gmail (use an App Password, not your real password) or any SMTP provider
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
app.jwt.secret=${JWT_SECRET:weatherconnect_jwt_secret_key_32_chars_min_256_bits}
app.jwt.expiration=86400000

# Frontend URL — used in password reset email links
app.frontend.url=${FRONTEND_URL:http://localhost:5174}

# Stripe
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.price.pro=${STRIPE_PRICE_PRO:price_pro_placeholder}
stripe.price.scale=${STRIPE_PRICE_SCALE:price_scale_placeholder}

# OpenAI
openai.api.key=${OPENAI_API_KEY:}

# Caffeine cache — keeps forecast/AQI/heatmap/summary results in memory for 10 minutes
# so we don't hammer OpenWeatherMap or the database on every request
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m,recordStats
spring.cache.cache-names=forecast,aqi,heatmap,dailySummary,latestWeather,insights
